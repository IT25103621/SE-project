<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Jobs - Auto Care Fuel &amp; Service</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="page-header">
        <div>
            <h1>My Jobs</h1>
            <p>Jobs assigned to you by the Inventory &amp; Service Manager.</p>
        </div>
    </div>

    <div class="card" th:if="${#lists.isEmpty(assignedJobs)}">
        <div class="empty-state"><p>No jobs assigned to you right now.</p></div>
    </div>

    <div class="card" th:unless="${#lists.isEmpty(assignedJobs)}">
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>Vehicle</th>
                    <th>Service</th>
                    <th>Customer</th>
                    <th>Booked</th>
                    <th class="text-right">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="job : ${assignedJobs}">
                    <td class="mono" th:text="${job.vehicle.plateNumber}"></td>
                    <td th:text="${job.service.name}"></td>
                    <td th:text="${job.customer.name}"></td>
                    <td class="mono" th:text="${#temporals.format(job.createdAt, 'dd MMM yyyy')}"></td>
                    <td class="text-right">
                        <form th:action="@{/mechanic/jobs/{id}/complete(id=${job.id})}" method="post">
                            <button type="submit" class="btn btn-primary btn-sm">Mark Completed</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="section" style="margin-top:2rem;">
        <h2>Recently Completed</h2>
        <div class="card" th:if="${#lists.isEmpty(completedJobs)}">
            <div class="empty-state"><p>No completed jobs yet.</p></div>
        </div>
        <div class="card" th:unless="${#lists.isEmpty(completedJobs)}">
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Vehicle</th>
                        <th>Service</th>
                        <th>Customer</th>
                        <th>Completed</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="job : ${completedJobs}">
                        <td class="mono" th:text="${job.vehicle.plateNumber}"></td>
                        <td th:text="${job.service.name}"></td>
                        <td th:text="${job.customer.name}"></td>
                        <td class="mono" th:text="${#temporals.format(job.completedAt, 'dd MMM, HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
