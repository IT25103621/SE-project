<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Auto Care Fuel &amp; Service</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container-narrow">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card">
        <h1 style="font-size:1.4rem;">Create your account</h1>
        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" th:field="*{name}" required autofocus>
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" required>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" th:field="*{phone}" required>
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" required>
                <div class="field-hint">At least 6 characters.</div>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block">Create account</button>
            </div>
        </form>
    </div>

    <p class="text-center muted" style="margin-top:1.25rem;">
        Already have an account? <a th:href="@{/login}">Log in</a>
    </p>
</main>
</body>
</html>
