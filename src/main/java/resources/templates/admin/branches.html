<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Branch Approvals - Auto Care Fuel &amp; Service</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container">
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

  <div class="page-header">
    <div>
      <h1>Branch Approvals</h1>
      <p>Review and approve new branch registrations.</p>
    </div>
  </div>

  <div class="section">
    <h2>Pending Approval</h2>
    <div class="card" th:if="${#lists.isEmpty(pendingBranches)}">
      <div class="empty-state"><p>No branches waiting on approval.</p></div>
    </div>
    <div class="card" th:unless="${#lists.isEmpty(pendingBranches)}">
      <div class="table-wrap">
        <table class="table">
          <thead>
          <tr>
            <th>Branch</th>
            <th>City</th>
            <th>Manager</th>
            <th class="text-right">Decision</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="b : ${pendingBranches}">
            <td th:text="${b.name}"></td>
            <td th:text="${b.city}"></td>
            <td th:text="${b.manager.name} + ' (' + ${b.manager.email} + ')'"></td>
            <td class="text-right">
              <div class="actions-row" style="justify-content:flex-end;">
                <form th:action="@{/admin/branches/{id}/approve(id=${b.id})}" method="post">
                  <button type="submit" class="btn btn-primary btn-sm">Approve</button>
                </form>
                <form th:action="@{/admin/branches/{id}/reject(id=${b.id})}" method="post">
                  <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                </form>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>All Branches</h2>
    <div class="card">
      <div class="table-wrap">
        <table class="table">
          <thead>
          <tr>
            <th>Branch</th>
            <th>City</th>
            <th>Manager</th>
            <th>Status</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="b : ${allBranches}">
            <td th:text="${b.name}"></td>
            <td th:text="${b.city}"></td>
            <td th:text="${b.manager.name}"></td>
            <td><span class="badge" th:classappend="${'badge-' + #strings.toLowerCase(b.status.name())}" th:text="${b.status}"></span></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</body>
</html>
