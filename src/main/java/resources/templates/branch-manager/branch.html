<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Branch Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .detail {
            margin-bottom: 18px;
        }

        .label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .value {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Branch Details</h1>

        <div class="card">

            <div class="detail">
                <span class="label">Branch Name</span>
                <span class="value" th:text="${branch.name}">Branch Name</span>
            </div>

            <div class="detail">
                <span class="label">City</span>
                <span class="value" th:text="${branch.city}">City</span>
            </div>

            <div class="detail">
                <span class="label">Address</span>
                <span class="value" th:text="${branch.address}">Address</span>
            </div>

            <div class="detail">
                <span class="label">Status</span>
                <span class="value" th:text="${branch.status}">Status</span>
            </div>

            <div class="detail" th:if="${branch.manager != null}">
                <span class="label">Manager Name</span>
                <span class="value" th:text="${branch.manager.name}">Manager Name</span>
            </div>

            <div class="detail" th:if="${branch.manager != null}">
                <span class="label">Manager Email</span>
                <span class="value" th:text="${branch.manager.email}">Manager Email</span>
            </div>

            <div class="detail" th:if="${branch.manager != null}">
                <span class="label">Manager Phone</span>
                <span class="value" th:text="${branch.manager.phone}">Manager Phone</span>
            </div>

        </div>

    </div>

</body>

</html>
