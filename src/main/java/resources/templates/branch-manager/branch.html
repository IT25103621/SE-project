<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Branch Details - Auto Care Fuel &amp; Service</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container">

  <div class="page-header">
    <div>
      <h1>Branch Details</h1>
      <p>View your branch information.</p>
    </div>
  </div>

  <div class="card">

    <h2>Branch Information</h2>

    <div class="form-row">

      <div class="form-group">
        <label>Branch Name</label>
        <p th:text="${branch.name}">Branch Name</p>
      </div>

      <div class="form-group">
        <label>City</label>
        <p th:text="${branch.city}">City</p>
      </div>

    </div>

    <div class="form-group">
      <label>Address</label>
      <p th:text="${branch.address}">Address</p>
    </div>

    <div class="form-group">
      <label>Status</label>

      <span class="badge"
            th:classappend="${'badge-' + #strings.toLowerCase(branch.status.name())}"
            th:text="${branch.status}">
                APPROVED
            </span>
    </div>

  </div>

  <div class="card" style="margin-top:1.25rem;">

    <h2>Branch Manager</h2>

    <div class="form-row">

      <div class="form-group">
        <label>Name</label>
        <p th:text="${branch.manager.name}">Manager Name</p>
      </div>

      <div class="form-group">
        <label>Email</label>
        <p th:text="${branch.manager.email}">Manager Email</p>
      </div>

    </div>

    <div class="form-group">
      <label>Phone</label>
      <p th:text="${branch.manager.phone}">Manager Phone</p>
    </div>

  </div>

</main>

</body>
</html>
