<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register a Branch - Auto Care Fuel &amp; Service</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="container-narrow">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card">
        <h1 style="font-size:1.4rem;">Register a branch</h1>
        <p class="muted" style="margin-top:-0.5rem;">Your branch goes live once the Main Admin approves it. This
            also creates your Branch Manager login.</p>

        <form th:action="@{/register-branch}" th:object="${branchRegisterForm}" method="post">
            <h3>Branch details</h3>
            <div class="form-group">
                <label for="branchName">Branch name</label>
                <input type="text" id="branchName" th:field="*{branchName}" required autofocus>
                <div class="field-error" th:if="${#fields.hasErrors('branchName')}" th:errors="*{branchName}"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" th:field="*{city}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}" required>
                    <div class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>
            </div>

            <h3 style="margin-top:1.75rem;">Branch manager (that's you)</h3>
            <div class="form-group">
                <label for="managerName">Full name</label>
                <input type="text" id="managerName" th:field="*{managerName}" required>
                <div class="field-error" th:if="${#fields.hasErrors('managerName')}" th:errors="*{managerName}"></div>
            </div>
            <div class="form-group">
                <label for="managerEmail">Email</label>
                <input type="email" id="managerEmail" th:field="*{managerEmail}" required>
                <div class="field-error" th:if="${#fields.hasErrors('managerEmail')}" th:errors="*{managerEmail}"></div>
            </div>
            <div class="form-group">
                <label for="managerPhone">Phone number</label>
                <input type="tel" id="managerPhone" th:field="*{managerPhone}" required>
                <div class="field-error" th:if="${#fields.hasErrors('managerPhone')}" th:errors="*{managerPhone}"></div>
            </div>
            <div class="form-group">
                <label for="managerPassword">Password</label>
                <input type="password" id="managerPassword" th:field="*{managerPassword}" required>
                <div class="field-hint">At least 6 characters.</div>
                <div class="field-error" th:if="${#fields.hasErrors('managerPassword')}" th:errors="*{managerPassword}"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block">Submit for approval</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
